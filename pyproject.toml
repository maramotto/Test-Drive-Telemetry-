[project]
name = "test-drive-telemetry"
version = "0.1.0"
description = "Vehicle test-drive telemetry ingestion, processing and analytics platform"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "kagglehub>=1.0.2",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
]
